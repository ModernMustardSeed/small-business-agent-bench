name: ci

# Validates every task (including replaying each reference solution), typechecks
# and runs the unit tests. No model is called and no secret is read.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node src/tasks.ts
      - run: pnpm typecheck
      - run: pnpm test
      - name: House style
        run: node src/style.ts
